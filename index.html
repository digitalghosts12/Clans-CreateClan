<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site Closed</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:#ffffff;
    width:100vw;
    height:100vh;
    height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:Arial, sans-serif;
  }
  .box{
    background:#000000;
    color:#ffffff;
    width:90%;
    max-width:520px;
    padding:60px 30px;
    border-radius:30px;
    text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,0.35);
  }
  .box h1{
    font-size:32px;
    font-weight:900;
    letter-spacing:1px;
    line-height:1.3;
  }
  .box p{
    margin-top:15px;
    font-size:15px;
    opacity:0.6;
    letter-spacing:2px;
  }
  .dot{
    width:12px;
    height:12px;
    background:#ff3b30;
    border-radius:50%;
    display:inline-block;
    margin-bottom:20px;
    box-shadow:0 0 20px #ff3b30;
  }
</style>
</head>
<body>
  <div class="box">
    <span class="dot"></span>
    <h1>The site has<br>been closed</h1>
    <p>CLANS</p>
  </div>
</body>
</html>
