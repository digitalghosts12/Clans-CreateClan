<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>manihaber</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{background:linear-gradient(135deg,#ffd6f5,#d6c8ff,#b8f0ff,#fff9b8,#ffc8dd);background-size:400% 400%;animation:bg 15s ease infinite;color:#fff;font-family:Arial,sans-serif;margin:0;text-align:center;min-height:100vh}
  @keyframes bg{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
  h1{font-size:48px;margin:10px 0 0;font-weight:900;background:linear-gradient(90deg,#ff0080,#ff8a00,#ffee00,#00e676,#00aaff,#a100ff,#ff0080);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:renk 8s linear infinite}
  @keyframes renk{0%{background-position:0% 50%}100%{background-position:300% 50%}}
  .altYazi{color:#5a4a6a;font-weight:bold;background:rgba(255,255,255,.7);display:inline-block;padding:8px 16px;border-radius:20px}
  .anaBtn{background:linear-gradient(45deg,#ff0080,#ff8a00,#ffee00,#00e676,#00aaff,#a100ff,#ff0080);background-size:300% 100%;color:#fff;border:none;padding:18px 32px;font-size:18px;font-weight:900;border-radius:25px;animation:renk 6s linear infinite;cursor:pointer}
  #duyuruAlani{display:none;padding:15px;padding-bottom:140px}
  .mesajKutusu{background:#fff;border-radius:20px;padding:15px;margin:15px auto;max-width:550px;text-align:left;color:#333;box-shadow:0 8px 25px rgba(0,0,0,.12)}
  .mesajKutusu.secili{border:2px solid red;background:#ffe0e0}
  .tarihSatiri{background:linear-gradient(90deg,#ff0080,#00aaff);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:13px;font-weight:900}
  .mesajYazisi{font-size:19px;margin-top:8px;line-height:1.4}
  .yoneticiBtn{background:linear-gradient(45deg,#a100ff,#00aaff);color:#fff;border:none;padding:12px 22px;border-radius:25px;margin-top:30px;font-weight:bold}
  #sifrePaneli{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(255,182,220,0.85);z-index:300;justify-content:center;align-items:center}
  #sifreIc{background:#fff;border:3px solid #ff8ad8;border-radius:25px;padding:20px;width:90%;max-width:360px;position:relative;padding-top:45px}
  #sifreX{position:absolute;top:-18px;left:50%;transform:translateX(-50%);background:#ff0080;color:white;border:2px solid white;width:38px;height:38px;border-radius:50%;font-size:20px;font-weight:bold}
  input,textarea{width:100%;padding:12px;margin:8px 0;background:#fff5fa;color:#333;border:2px solid #ffb8dd;border-radius:15px;font-size:16px}
  #sagAltBtn{display:none;position:fixed;bottom:20px;right:20px;background:linear-gradient(45deg,#ff0080,#ff8a00,#ffee00,#00e676);color:#fff;border:none;width:65px;height:65px;border-radius:50%;font-size:30px;font-weight:bold;z-index:100}
  #yazmaKutusu{display:none;position:fixed;bottom:95px;right:15px;left:15px;background:#fff;border:3px solid #ffb8dd;padding:15px;border-radius:20px;z-index:101}
  .gonderBtn{background:linear-gradient(45deg,#ff0080,#a100ff,#00aaff);color:#fff;border:none;padding:14px;width:100%;border-radius:20px;font-weight:900;font-size:16px}
  #dilBtn{position:fixed;bottom:20px;left:20px;background:linear-gradient(45deg,#00aaff,#a100ff);color:white;border:2px solid white;padding:12px 18px;border-radius:30px;font-weight:bold;z-index:100}
  #dilPaneli{display:none;position:fixed;bottom:70px;left:15px;background:#fff;border:2px solid #ffb8dd;border-radius:20px;padding:10px;z-index:102;width:220px;text-align:left;color:#333}
  .dilSec{display:block;width:100%;background:#fff0f8;color:#333;border:none;padding:12px;margin:4px 0;border-radius:15px;text-align:left;font-weight:bold}
  .dilSec.aktif{background:linear-gradient(45deg,#ff0080,#a100ff);color:white}
  #aktif-kutu{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#fff;color:#ff0080;padding:10px 18px;border-radius:50px;font-size:14px;font-weight:900;z-index:99;border:2px solid #ffb8dd;white-space:nowrap}
  .aktif-nokta{display:inline-block;width:10px;height:10px;background:#00e676;border-radius:50%;margin-right:6px}
</style>
</head>
<body>
<h1>manihaber 💖</h1>
<p class="altYazi" id="altBaslik">✨ Resmi Duyuru Sistemi - Herkes Okuyabilir, Sadece Yönetici Yazabilir ✨</p><br>
<button class="anaBtn" id="duyuruBtn" onclick="duyurulariGoster()">📢 DUYURULARI GÖR</button>
<div id="duyuruAlani"></div>
<button class="yoneticiBtn" id="yoneticiBtn" onclick="sifrePaneliniAc()">⚙️ Yönetici Girişi</button>
<div id="sifrePaneli"><div id="sifreIc"><button id="sifreX" onclick="sifrePaneliniKapat()">✕</button><h3 id="sifreBaslik" style="color:#ff0080;margin:0">YÖNETİCİ GİRİŞİ 💖</h3><input type="password" id="sifreInput" placeholder="Şifreni yaz"><button class="anaBtn" style="width:100%;padding:12px" onclick="sifreyiDogrula()">GİRİŞ YAP</button><p id="sifreDurum" style="color:red"></p></div></div>
<button id="sagAltBtn" onclick="yazmaKutusunuAc()">+</button>
<div id="yazmaKutusu"><textarea id="yeniMesajInput" placeholder="Mesajını yaz... 💖"></textarea><button class="gonderBtn" onclick="mesajGonder()">GÖNDER 🚀</button><button onclick="yazmaKutusunuKapat()" style="background:none;border:none;color:#888;margin-top:10px">Vazgeç</button></div>
<button id="dilBtn" onclick="dilPaneliniAc()">🌐 Language</button>
<div id="dilPaneli"><b>Dil Seç</b><button class="dilSec" onclick="diliDegistir('tr')">🇹🇷 Türkçe</button><button class="dilSec" onclick="diliDegistir('en')">🇬🇧 English</button><button class="dilSec" onclick="diliDegistir('es')">🇪🇸 Español</button><button class="dilSec" onclick="diliDegistir('fr')">🇫🇷 Français</button><button class="dilSec" onclick="diliDegistir('ru')">🇷🇺 Русский</button><button class="dilSec" onclick="diliDegistir('de')">🇩🇪 Deutsch</button><button onclick="dilPaneliniKapat()" style="background:none;border:none;color:#888;width:100%">Kapat</button></div>
<div id="aktif-kutu"><span class="aktif-nokta"></span><span id="aktif-sayi">1</span> aktif 💖</div>

<script>
// TUŞLAR BURADA - Firebase bozulsa bile çalışır!
let mesajlar = JSON.parse(localStorage.getItem('mh_mesajlar') || '[]');
let yoneticiMi = false;
let seciliDil = localStorage.getItem('mh_dil') || 'tr';
const SIFRE = "bNbN80";
if(mesajlar.length===0){ mesajlar=[{tarih:"7 / 11 / 2026 - 14:00", yazi:"selam"}]; localStorage.setItem('mh_mesajlar', JSON.stringify(mesajlar)); }

function duyurulariGoster(){
  let alan=document.getElementById('duyuruAlani');
  if(alan.style.display==='block'){ alan.style.display='none'; return; }
  alan.style.display='block';
  alan.innerHTML="";
  if(mesajlar.length===0){ alan.innerHTML="<p>Henüz duyuru yok.</p>"; return; }
  mesajlar.forEach(m=>{
    let div=document.createElement('div');
    div.className='mesajKutusu';
    div.innerHTML=`<div class="tarihSatiri">📅 ${m.tarih}</div><div class="mesajYazisi">${m.yazi}</div>`;
    alan.appendChild(div);
  });
}
function sifrePaneliniAc(){ let p=document.getElementById('sifrePaneli'); p.style.display = (p.style.display==='flex')?'none':'flex'; }
function sifrePaneliniKapat(){ document.getElementById('sifrePaneli').style.display='none'; }
function sifreyiDogrula(){
  let g=document.getElementById('sifreInput').value;
  if(g===SIFRE){ yoneticiMi=true; document.getElementById('sagAltBtn').style.display='block'; document.getElementById('sifrePaneli').style.display='none'; alert("Hoş geldin Patron! 💖"); }
  else alert("Yanlış şifre!");
}
function yazmaKutusunuAc(){ let p=document.getElementById('yazmaKutusu'); p.style.display=(p.style.display==='block')?'none':'block'; }
function yazmaKutusunuKapat(){ document.getElementById('yazmaKutusu').style.display='none'; }
function mesajGonder(){
  if(!yoneticiMi){ alert("Önce şifre gir!"); return; }
  let yazi=document.getElementById('yeniMesajInput').value.trim();
  if(!yazi){ alert("Boş mesaj!"); return; }
  let s=new Date(); let tarih=String(s.getDate()).padStart(2,'0')+" / "+String(s.getMonth()+1).padStart(2,'0')+" / "+s.getFullYear()+" - "+String(s.getHours()).padStart(2,'0')+":"+String(s.getMinutes()).padStart(2,'0');
  mesajlar.unshift({tarih:tarih, yazi:yazi});
  localStorage.setItem('mh_mesajlar', JSON.stringify(mesajlar));
  document.getElementById('yeniMesajInput').value="";
  yazmaKutusunuKapat();
  // Firebase varsa oraya da gönder
  if(window.firebaseGonder) window.firebaseGonder(tarih, yazi);
  let alan=document.getElementById('duyuruAlani'); alan.style.display='none'; duyurulariGoster();
  alert("Mesaj yayınlandı! 💖");
}
function dilPaneliniAc(){ let p=document.getElementById('dilPaneli'); p.style.display=(p.style.display==='block')?'none':'block'; }
function dilPaneliniKapat(){ document.getElementById('dilPaneli').style.display='none'; }
function diliDegistir(dil){ seciliDil=dil; localStorage.setItem('mh_dil',dil); alert("Dil değişti: "+dil); dilPaneliniKapat(); }
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue, push, set, onDisconnect } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const firebaseConfig = {
  apiKey: "BURAYA",
  authDomain: "BURAYA",
  databaseURL: "BURAYA",
  projectId: "BURAYA",
  storageBucket: "BURAYA",
  messagingSenderId: "BURAYA",
  appId: "BURAYA"
};
try{
  // Eğer BURAYA dolu değilse Firebase'i atla, tuşlar yine çalışsın
  if(firebaseConfig.apiKey !== "BURAYA"){
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const mesajRef = ref(db, "manihaber-mesajlar");
    window.firebaseGonder = (tarih, yazi)=>{ push(mesajRef,{tarih:tarih, yazi:yazi, zaman: Date.now()}); };
    onValue(mesajRef,(snap)=>{
      let data=snap.val()||{};
      let liste=Object.keys(data).map(k=>({id:k, ...data[k]})).sort((a,b)=>(b.zaman||0)-(a.zaman||0));
      if(liste.length>0){ mesajlar=liste; localStorage.setItem('mh_mesajlar', JSON.stringify(mesajlar)); let alan=document.getElementById('duyuruAlani'); if(alan.style.display==='block'){ alan.style.display='none'; duyurulariGoster(); } }
    });
    const aktifRef = ref(db, "aktifler-manihaber");
    const benimKaydim = push(aktifRef); set(benimKaydim,true); onDisconnect(benimKaydim).remove();
    onValue(aktifRef,(snap)=>{ let sayi=snap.size; if(sayi<1) sayi=1; document.getElementById("aktif-sayi").innerText=sayi; });
  }
}catch(e){ console.log("Firebase yok, local çalışıyor"); }
</script>
</body>
</html>
